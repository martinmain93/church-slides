name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # --- Toolchains ---------------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Tauri 2 build dependencies on Linux
      - name: Install system libs for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential

      # --- Install ------------------------------------------------------------
      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: uv sync (sidecar)
        working-directory: sidecar
        run: uv sync

      # --- Codegen drift -------------------------------------------------------
      - name: Regenerate TS types
        run: pnpm codegen

      - name: Fail if generated types are out of sync
        run: |
          if ! git diff --exit-code src/types/generated.ts; then
            echo "::error::src/types/generated.ts is stale. Run 'pnpm codegen' and commit."
            exit 1
          fi

      # --- Tests --------------------------------------------------------------
      - name: TypeScript build
        run: pnpm build

      - name: Vitest
        run: pnpm test

      - name: Sidecar pytest
        working-directory: sidecar
        run: uv run pytest -q

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib
