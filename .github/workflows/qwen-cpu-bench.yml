# One-off research run: how fast Qwen3-ASR 0.6B (int4 ONNX) runs a live pass
# on GitHub's x86 runners' processors (research/spikes/qwen_cpu/).
# Runs only when the bench/qwen-cpu or qwen-cpu-backend branch is pushed. Public-domain audio only.
#
# 1. export: builds decoder_extend (prefill only the newest audio, reusing the
#    cache) from the public model with andrewleech/qwen3-asr-onnx (Apache 2.0)
#    and quantizes it to int8 (the app's) and int4.
# 2. bench: times the app's step (app_step_bench.py) on Windows and Linux.
name: Qwen CPU bench

on:
  push:
    branches: [bench/qwen-cpu, qwen-cpu-backend]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewleech/qwen3-asr-onnx
          ref: 4aee2ae0c355c7bc33bd5c09befec9e9eabd4b50
          path: qwen3-asr-onnx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --quiet
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==2.15.0 transformers==4.57.6 qwen-asr==0.0.6 accelerate==1.12.0
          onnx==1.23.2 onnxruntime==1.32.0 onnxscript==0.7.2 numpy
      - run: python research/spikes/qwen_cpu/export_extend.py extend
        env:
          QWEN_ONNX_TOOL: ${{ github.workspace }}/qwen3-asr-onnx
      - run: >-
          python research/spikes/qwen_cpu/quantize_extend.py extend/decoder_extend.onnx
          q/decoder_extend.int8.onnx --bits 8 --accuracy-level 4
      - run: >-
          python research/spikes/qwen_cpu/quantize_extend.py extend/decoder_extend.onnx
          q/decoder_extend.int4.onnx --bits 4 --accuracy-level 4
      - uses: actions/upload-artifact@v4
        with:
          name: decoder-extend
          path: q/
          retention-days: 3

  bench:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet onnxruntime==1.32.0 numpy huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: decoder-extend
          path: q
      - name: Download the published int4 model
        run: python -c "from huggingface_hub import snapshot_download as d; import sys; sys.path.insert(0, 'research/spikes/qwen_cpu'); from step_bench import FILES, REPO; print(d(REPO, allow_patterns=FILES, local_dir='model'))"
      - run: python research/spikes/qwen_cpu/app_step_bench.py model q/decoder_extend.int8.onnx 0 4
      - run: python research/spikes/qwen_cpu/app_step_bench.py model q/decoder_extend.int4.onnx 0 4
