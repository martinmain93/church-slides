# For running the relay locally (`pnpm relay:dev`) and in tests only. Real
# deployments go into each church's own Cloudflare account from the desktop
# app (src-tauri/src/cloud.rs), with the same bindings set there.
name = "church-slides-relay"
main = "dist/worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
HOST_KEY = "local-dev-host-key"
