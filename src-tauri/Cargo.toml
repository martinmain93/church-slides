[package]
name = "auto-presenter"
version = "0.2.2"
description = "Church Slides — AI-driven worship slide presenter"
authors = ["Church Slides"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "auto_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
# In-app updates: checks the latest.json that scripts/release.sh publishes,
# downloads the signed .app.tar.gz, swaps the bundle, and relaunches.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "macros", "rt-multi-thread", "net", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ulid = "1"
axum = { version = "0.7", features = ["ws"] }
local-ip-address = "0.6"
keepawake = "0.6.1"
# Resolves the app-data and Claude Desktop config dirs when the binary runs
# as a headless MCP server (`--mcp`), where there is no Tauri path resolver.
dirs = "6"
# Operator-to-operator setlist sync: Bonjour discovery on the LAN, and a
# plain-HTTP client for the other laptop's peer server. TLS + multipart are
# for the online band relay, deployed to the church's Cloudflare account.
mdns-sd = "0.13"
netdev = "0.40"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# Online band relay: room keys (HMAC-SHA256) and the OAuth PKCE challenge.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Reading ProPresenter 22 libraries for "Bring your songs" (other_apps.rs):
# its documents are Loro CRDT snapshots. MIT.
loro = "1.17"
rand = "0.8"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Crash and error reports (telemetry.rs). No default features: those pull
# native-tls, and everything else here already speaks rustls.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# Debug-only at runtime (`#[cfg(debug_assertions)]` in lib.rs). Listed as a
# regular dep so ACL codegen can see `mcp-bridge:default`; the plugin is
# never initialised in a release binary. Not on Windows: 0.13's screenshot
# code doesn't compile against the webview2-com that tauri 2.12 brings, and
# the agent driver is only used on the dev Macs anyway
# (capabilities/mcp-bridge.json is scoped to match).
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-mcp-bridge = "0.13"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The performance suite's app build (scripts/build_perf_app.sh): an optimised
# binary with the agent UI driver and the engine's dev tools, under its own
# name and data folder. Never enabled by `tauri build` or release.sh.
ui-driver = []
